<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT REVIEW FOR ARUA WATER RAFTING COMPANY</title>
    <meta name="description" content="Official product review page for the ARUA WATER RAFTING COMPANY. ">
    <meta name="author" content="RWOTOMIYO ISAIAH">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header><h1>PRODUCT REVIEW</h1></header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <h2>Select Product</h2>
                <label>Product Name *
                <select  id="products" name="product" required>
                    <option selected disabled>Select a Product to Review</option>
                </select></label>
            </fieldset>
            <fieldset class="radio">
                <label>
                    <h2>RATE PRODUCT</h2>
                <div class="star-rating">
                    <input type="radio" id="fivestar" name="star" value="5" required>
                    <label for="fivestar"></label>
                    <input type="radio" id="fourstar" name="star" value="4" required><label for="fourstar"></label>
                    <input type="radio" id="threestar" name="star" value="3" required><label for="threestar"></label>
                    <input type="radio" id="twostar" name="star" value="2" required><label for="twostar"></label>
                    <input type="radio" id="onestar" name="star" value="1" required><label for="onestar"></label>
                </label>
                </div>
            </fieldset>
            <fieldset>
                <label>Date of Installation *
                    <input type="date" id="date" name="date" required>
                </label>
            </fieldset>
            <fieldset>
                <h2>Features found useful? (Optional)</h2>
                <label><input type="checkbox" name="useful" value="durability"> Durability</label>
                <label><input type="checkbox" name="useful" value="ease"> Ease of Use</label>
                <label><input type="checkbox" name="useful" value="performance"> Performance</label>
                <label><input type="checkbox" name="useful" value="design"> Design</label>
            </fieldset>
            <fieldset>
                <label>Your Review (Optional)
                    <textarea id="review" name="review" rows="4"
                        placeholder=" Type Here"></textarea>
                </label>
            </fieldset>
            <fieldset>
                <h2>Customer Credentials (Optional)</h2>
                <label >FULL NAME <input type="text" id="fname" name="fname" ></label>
                <label >Email <input type="email" id="email" name="email"></label>
            </fieldset>
            <label><input type="submit" value="Send Review"></label>
  
        </form>
    </main>

   <footer>
        <p>Copyright &copy; Year: <span id="currentyear">${current_year}</span> RWOTOMIYO ISAIAH ; UGANDA</p>
        <p id="last_modified"> Last modified:  <span id="lastmodified"></span></p>

    </footer>
</body>

</html>
