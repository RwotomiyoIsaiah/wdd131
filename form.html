<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT REVIEW FOR ARUA WATER RAFTING COMPANY</title>
    <meta name="description" content="Official product review page for the ARUA WATER RAFTING COMPANY. ">
    <meta name="author" content="RWOTOMIYO ISAIAH">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header><h1>PRODUCT REVIEW</h1></header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <h2>Select Product</h2>
                <label for="products">Product Name *</label>
                <select  id="products" name="product" required>
                    <option value="" selected disabled>Select a Product to Review</option>
                </select>
            </fieldset>
            <fieldset class="radio">
                <h2>RATE PRODUCT</h2>   
                <div class="star-rating">
                    <input type="radio" id="fivestar" name="star" value="5" required><label for="fivestar"></label>
                    <input type="radio" id="fourstar" name="star" value="4" required><label for="fourstar"></label>
                    <input type="radio" id="threestar" name="star" value="3" required><label for="threestar"></label>
                    <input type="radio" id="twostar" name="star" value="2" required><label for="twostar"></label>
                    <input type="radio" id="onestar" name="star" value="1" required><label for="onestar"></label>

                </div>
            </fieldset>
            <fieldset>
                <label for="date">Date of Installation *</label>
                    <input type="date" id="date" name="date" required>
                
            </fieldset>
            <fieldset>
                <h2>Features found useful? (Optional)</h2>
                <label for="useful-durability"><input  id="useful-durability" type="checkbox" name="useful" value="durability"> Durability</label>
                <label for="useful-ease"><input id="useful-ease" type="checkbox" name="useful" value="ease"> Ease of Use</label>
                <label for="useful-performance"><input id="useful-performance" type="checkbox" name="useful" value="performance"> Performance</label>
                <label for="useful-design"><input id="useful-design" type="checkbox" name="useful" value="design"> Design</label>
            </fieldset>
            <fieldset>
                <label  for="review">Your Review (Optional)
                    <textarea id="review" name="review" rows="4"
                        placeholder=" Type Here"></textarea>
                </label>
            </fieldset>
            <fieldset>
                <h2>Customer Credentials (Optional)</h2>
                <label for="fname">FULL NAME</label>
                <input type="text" id="fname" name="fname" >

                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </fieldset>
            <a href="review.html"><input type="submit" value="Send Review"></a>
  
        </form>
    </main>

   <footer>
        <p>Copyright &copy; Year: <span id="currentyear">${current_year}</span> RWOTOMIYO ISAIAH ; UGANDA</p>
        <p id="last_modified"> Last modified:  <span id="lastmodified"></span></p>

    </footer>
</body>

</html>
