<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore and filter luxury riverfront cottages and eco-suites at Nile Haven River Resort.">
  <title>Nile Haven River Resort | Accommodations</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/main.js" defer></script>
  <script src="scripts/accommodations.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <span class="logo-title">Nile Haven</span>
        <span class="logo-sub">River Resort</span>
      </a>
      <button id="hamburger-btn" class="hamburger" aria-label="Toggle Navigation Menu">&#9776;</button>
      <nav id="primary-nav" class="nav-menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="accommodations.html" class="active">Accommodations</a></li>
          <li><a href="contact.html">Book / Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section-container">
    <h1 class="page-title">Riverfront Cottages & Suites</h1>
    <p class="intro-text">Find your perfect sanctuary overlooking the tranquil waters of the Nile.</p>

    <!-- JS FILTER BUTTONS -->
    <div class="filter-controls">
      <button class="filter-btn active" data-filter="all">All Units</button>
      <button class="filter-btn" data-filter="couples">Couples (1-2 Guests)</button>
      <button class="filter-btn" data-filter="family">Family (3+ Guests)</button>
      <button class="filter-btn" data-filter="luxury">Luxury Tier</button>
    </div>

    <!-- DYNAMIC CARDS CONTAINER -->
    <div id="cottage-grid" class="grid-3">
      <!-- Injected via JavaScript (accommodations.js) -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; <span id="current-year"></span> Nile Haven River Resort | All Rights Reserved</p>
      <p><a href="references.html">References & Image Citations</a></p>
      <p>Last Modified: <span id="last-modified"></span></p>
    </div>
  </footer>

</body>
</html>
