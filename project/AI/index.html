<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserve your stay or inquire about activities at Nile Haven River Resort.">
  <title>Nile Haven River Resort | Book & Contact</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/main.js" defer></script>
  <script src="scripts/contact.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <span class="logo-title">Nile Haven</span>
        <span class="logo-sub">River Resort</span>
      </a>
      <button id="hamburger-btn" class="hamburger" aria-label="Toggle Navigation Menu">&#9776;</button>
      <nav id="primary-nav" class="nav-menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="accommodations.html">Accommodations</a></li>
          <li><a href="contact.html" class="active">Book / Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section-container max-w-med">
    <h1 class="page-title">Reserve Your Stay</h1>
    <p class="intro-text">Complete the form below to initiate your booking inquiry or submit guest questions.</p>

    <!-- FORM -->
    <form id="booking-form" action="contact.html" method="get" class="form-card">
      
      <div class="form-group">
        <label for="fullName">Full Name <span class="req">*</span></label>
        <input type="text" id="fullName" name="fullName" required placeholder="e.g., Jane Doe">
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" name="email" required placeholder="jane@example.com">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+256 700 000 000">
      </div>

      <div class="form-group">
        <label for="stayType">Accommodation Type <span class="req">*</span></label>
        <select id="stayType" name="stayType" required>
          <option value="" disabled selected>Select an option...</option>
          <option value="Honeymoon Cottage">Honeymoon Haven Cottage ($180/night)</option>
          <option value="Deluxe River Cottage">Deluxe Nile View Cottage ($220/night)</option>
          <option value="Family Villa">Grand Riverfront Family Villa ($350/night)</option>
          <option value="Day Visitor">Day Visitor / Activity Only</option>
        </select>
      </div>

      <div class="form-group">
        <label for="checkIn">Check-In Date <span class="req">*</span></label>
        <input type="date" id="checkIn" name="checkIn" required>
      </div>

      <div class="form-group">
        <label for="guests">Number of Guests <span class="req">*</span></label>
        <input type="number" id="guests" name="guests" min="1" max="12" value="2" required>
      </div>

      <fieldset class="form-fieldset">
        <legend>Add-On Experiences</legend>
        <label class="checkbox-label">
          <input type="checkbox" name="addons" value="White-Water Rafting"> White-Water Rafting Trip
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="addons" value="Sunset Dinner Cruise"> Sunset Dinner Cruise
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="addons" value="Kayaking Session"> Guided Nile Kayaking
        </label>
      </fieldset>

      <div class="form-group">
        <label for="comments">Special Requests or Questions</label>
        <textarea id="comments" name="comments" rows="4" placeholder="Dietary needs, airport transfer inquiries, etc."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Submit Booking Inquiry</button>

    </form>

    <!-- SUBMISSION FEEDBACK MODAL/ALERT CONTAINER -->
    <div id="form-feedback" class="feedback-card hidden"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; <span id="current-year"></span> Nile Haven River Resort | All Rights Reserved</p>
      <p><a href="references.html">References & Image Citations</a></p>
      <p>Last Modified: <span id="last-modified"></span></p>
    </div>
  </footer>

</body>
</html>
